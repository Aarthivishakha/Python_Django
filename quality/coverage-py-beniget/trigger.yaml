tool: "coverage.py+beniget"
version: "coverage 7.14.1 / beniget 0.5.0"
language: python
language_version: "3.15"
technique: "Control Flow Testing + Data Flow Testing"
classification: "Coverage Reporting Validation"
target_files:
  - ../../catalog/pricing.py
  - ../../catalog/tests/test_pricing.py
run:
  command: "coverage run --branch -m pytest catalog/tests/test_pricing.py && coverage report -m && python -c \"import gast as ast; from beniget import DefUseChains; src=open('catalog/pricing.py').read(); m=ast.parse(src); d=DefUseChains(filename='pricing.py'); d.visit(m); print('def-use chains:', len(d.chains))\""
requirements:
  - coverage==7.14.1
  - beniget==0.5.0
  - gast>=0.5.0
expects:
  branch_coverage_report_generated: true
  dead_def_report_generated: true

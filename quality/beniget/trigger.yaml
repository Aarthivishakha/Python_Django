tool: beniget
version: "0.5.0"
language: python
language_version: "2.6"
technique: "Data Flow Testing"
classification: "All-Defs / All-Uses Coverage"
target_files:
  - ../../catalog/pricing.py
run:
  command: "python quality/beniget/run_beniget.py"
requirements:
  - beniget==0.5.0
  - gast>=0.5.0
notes: >
  Modern beniget releases require Python 3.6+ to install and run,
  so this analysis runs under Python 3 even though the target
  catalog/pricing.py it parses is written for Python 2.6 - beniget
  parses the source as an AST rather than executing it, so this works
  despite the language-version mismatch.
expects:
  dead_defs_report_generated: true

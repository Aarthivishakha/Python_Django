tool: cosmic-ray
version: "8.4.6"
language: python
language_version: "2.6"
technique: "Mutation Testing"
classification: "Mutation Score"
target_files:
  - ../../catalog/pricing.py
  - ../../cosmic-ray.toml
run:
  command: "cosmic-ray init cosmic-ray.toml session.sqlite && cosmic-ray exec cosmic-ray.toml session.sqlite && cr-report session.sqlite"
requirements:
  - cosmic-ray==8.4.6
notes: >
  Uses `python manage.py test catalog` (catalog/tests.py, Django 1.5's
  own unittest-based runner) as the killing test suite instead of
  pytest, since there's no tests/test_pricing.py submodule on this
  branch. Modern cosmic-ray requires Python 3.7+ to install; it mutates
  the source file directly and shells out to run the test command, so
  the mutation-testing process itself runs under Python 3 even though
  the test-command it invokes needs an actual Python 2.6 interpreter on
  PATH to execute manage.py test.
expects:
  mutants_generated_and_tested: true

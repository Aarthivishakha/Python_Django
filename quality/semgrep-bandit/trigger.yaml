tool: "semgrep+bandit"
version: "semgrep 1.172.0 / bandit 1.8.3"
language: python
language_version: "2.7"
technique: "Security White-box Testing (SAST)"
classification: "Secure Coding Validation"
target_files:
  - ../../config/settings.py
  - ../../catalog
run:
  command: "bandit -r catalog config && semgrep --config auto catalog config"
requirements:
  - semgrep>=1.172.0
  - bandit==1.8.3
expects:
  findings_detected: true
notes: >
  config/settings.py has a real hardcoded SECRET_KEY - a genuine SAST
  finding, not a synthetic one.

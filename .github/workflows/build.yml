name: Build

on:
  push:
    branches: [PYTHON_2.6]
  pull_request:
    branches: [PYTHON_2.6]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: GitHub-hosted runners do not ship a Python 2.6 interpreter
      # (setup-python's tool cache doesn't go back that far), so this step
      # will likely fail to provision on actions/setup-python@v5. Kept for
      # branch consistency; run build.sh locally under a real Python 2.6
      # instead.
      - uses: actions/setup-python@v5
        with:
          python-version: "2.6"

      - name: Build
        run: bash build.sh
